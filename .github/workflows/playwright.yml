name: Menu tests

# Manual only: these tests drive the live greggs.com site, so they are not run on every push.
# GitHub: Actions tab > "Menu tests" > Run workflow.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Screen size to test'
        type: choice
        default: desktop
        options: [desktop, mobile, tablet, all]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run tests
        run: |
          if [ "${{ inputs.project }}" = "all" ]; then
            npx playwright test
          else
            npx playwright test --project=${{ inputs.project }}
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            reports/html
            reports/junit.xml
            reports/results.json
          retention-days: 14
